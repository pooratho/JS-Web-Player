<!doctype html>
<html lang="en" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS-Web-Player</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="player-container">
      <!-- تگ Audio فقط یک بار و بدون src -->
      <audio id="audio-element"></audio>

      <!-- اطلاعات آهنگ -->
      <div class="song-info">
        <h3 id="song-title">Unknown Song</h3>
        <p id="song-artist">Unknown Artist</p>
      </div>

      <!-- نوار پیشرفت -->
      <div class="progress-container">
        <span id="current-time">00:00</span>
        <input type="range" id="progress-bar" value="0" min="0" step="1" />
        <span id="duration">00:00</span>
      </div>

      <!-- دکمه‌های کنترل (همه در یک جا تجمیع شدند) -->
      <div class="controls">
        <button id="prev-btn">Previous</button>
        <button id="play-pause-btn">Play</button>
        <button id="next-btn">Next</button>
      </div>

      <!-- کنترل صدا -->
      <div class="volume-controls">
        <button id="mute-btn">Mute</button>
        <input
          type="range"
          id="volume-slider"
          min="0"
          max="1"
          step="0.01"
          value="1"
        />
      </div>
      <div class="playlist-container">
        <ul id="playlist-list"></ul>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
